# Postgres schema snapshots + dependency graph → main.
#
# GitHub-hosted runners can't reach the databases (private endpoints only since
# 2026-09-30), so the introspection runs in the `KB DB Snapshot` Databricks job
# (databricks.yml, 06:15 UTC) which parks the generated files on the dev blob.
# This workflow only downloads them, regenerates the dependency graph (pure
# Python over the committed pages) and commits. A stale snapshot (> 36 h) fails
# the run on purpose: a stopped Databricks job must show as a red row on
# infrastructure/kb-health.md, not as a silently frozen schema page.
name: DB schema snapshot
on:
  schedule:
    - cron: "41 6 * * *"   # 06:41 UTC daily (Databricks snapshot lands ~06:20)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (ruleset bypass for the auto-commit)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KB_BOT_APP_ID }}
          private-key: ${{ secrets.KB_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download the snapshot from blob (written by the KB DB Snapshot Databricks job)
        env:
          SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          test -n "$SAS" || { echo "::error::DSCI_AZ_BLOB_DEV_SAS org secret is not visible to this repo"; exit 1; }
          base="https://imb0chd0dev.blob.core.windows.net/projects/ds-knowledge-base/db-snapshot/latest"
          for f in manifest.json db-schema.md db-schema-dev.md .db-tables.json .db-tables-dev.json; do
            curl -fsS -o "infrastructure/$f" "$base/$f?${SAS#\?}"
          done
          python scripts/db_snapshot_blob.py check --to infrastructure --max-age-hours 36
          rm infrastructure/manifest.json

      - name: Regenerate dependency graph
        run: |
          pip install -q pyyaml
          python scripts/gen_dependency_graph.py   # graph uses the prod table list

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/db-schema.md infrastructure/db-schema-dev.md infrastructure/.db-tables.json infrastructure/.db-tables-dev.json infrastructure/dependency-graph.md
          if git diff --staged --quiet; then
            echo "no schema changes"
          else
            git commit -m "chore: refresh DB schema snapshot + dependency graph [skip ci]"
            git push
          fi
