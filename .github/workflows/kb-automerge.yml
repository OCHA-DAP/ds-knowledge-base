# Auto-merge the steward's deterministic re-sync PRs after a quiet period (D119).
# A kb-ingest PR merges itself only when it is older than 3 days with no human word on it,
# CI is green, exactly one page changed, the page BODY is byte-identical, and the only
# frontmatter keys that moved are the spoke-dictated bookkeeping ones (source_sha, code_ref,
# sync stamps). Everything else keeps waiting for a person. The script prints one line per
# open draft with its decision, so the run log doubles as the "aging drafts" list.
name: KB auto-merge (deterministic re-syncs)
on:
  schedule:
    - cron: "33 8 * * *"   # 08:33 UTC daily, after the detectors and the steward
  workflow_dispatch:
    inputs:
      dry_run:
        description: "list decisions without merging"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (bot-attributed merge)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KB_BOT_APP_ID }}
          private-key: ${{ secrets.KB_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Decide and merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pip install -q pyyaml
          python scripts/automerge_resyncs.py ${{ inputs.dry_run && '--dry-run' || '' }}
