name: Publish AA site + team hub

# Publishes the public site to GitHub Pages on every push to main. Two things are served — the KB
# itself has NO rendered mirror (D87 — the MkDocs mirror was removed; the GitHub interface is the
# browsing surface):
#   /                      the TEAM HUB (D103): every DS dashboard / app / published analysis on one
#                          visual page, generated from the committed registries (no network at deploy)
#   /anticipatory-action/  the cross-organisation AA page only (global.html, D79). The OCHA
#                          status map, trigger statistics and per-framework pages were retired
#                          in favour of the ds-aa-tracking site (D110); their old URLs redirect
#                          there so nothing external 404s.
#   /db-network/           the DSCI Database Network map (D109): every job/app that reads or writes the
#                          Postgres databases, the table groups, and the CERF frameworks downstream —
#                          generated from page frontmatter + the committed DB/registry snapshots
# Requires the repo's Pages "Source" to be set to "GitHub Actions" (Settings → Pages).

on:
  push:
    branches: [main]
  # The registry / DB-snapshot generators commit with [skip ci], so without this the health markers and
  # table lists on /db-network/ would only refresh at the next ordinary push. workflow_run fires on the
  # scheduled run itself, not on its commit, so [skip ci] does not suppress it.
  workflow_run:
    workflows: ["Pipeline registry & health", "DB schema snapshot", "Listmonk lists snapshot"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet pyyaml
      - name: Regenerate served content from current pages (no-DB generators)
        # The site is deployed on every push to main, so generate the served artifacts HERE
        # from the live page frontmatter — that way the cross-org page always reflects the
        # KB. These are pure frontmatter→output (no DB/secrets).
        run: |
          python scripts/gen_global_site.py       # aa_global.html — cross-org map+table (D79)
          python scripts/gen_aa_site.py           # aa_global_view.html — the shell around it
          # The team hub (D103) reads the committed .pages-registry.json / .infra-baseline.json +
          # frontmatter. Its generator refuses to write on a bad input (exit 1) — that must NOT
          # fail this job, which also publishes /anticipatory-action/: fall back to the committed
          # hub.html (a cache, at worst a week old) and surface the problem as a warning.
          python scripts/gen_team_hub.py \
            || echo "::warning title=team hub not regenerated::gen_team_hub.py failed — deploying the committed hub.html instead (check .pages-registry.json / .infra-baseline.json)"
          # The database network map (D109) reads pipeline/app/framework frontmatter + the committed
          # .db-tables*.json / .pipeline-registry.json + infrastructure/db-network.yml. Same fallback
          # rule as the hub: on failure deploy the committed db_network.html and warn.
          python scripts/gen_db_network.py \
            || echo "::warning title=db network not regenerated::gen_db_network.py failed — deploying the committed db_network.html instead (check infrastructure/db-network.yml and the .db-tables*.json / .pipeline-registry.json snapshots)"
      - name: Assemble /anticipatory-action/ (cross-org page + redirects to ds-aa-tracking, D110)
        run: |
          mkdir -p site/anticipatory-action/frameworks
          cp aa_global_view.html site/anticipatory-action/global.html # shell: header + all-orgs iframe (D79)
          cp aa_global.html    site/anticipatory-action/global-map.html # the cross-org map+table content
          # The OCHA portfolio views (status map, trigger statistics, per-framework pages) moved to
          # the ds-aa-tracking site (D110). Their old URLs — linked from READMEs, KB pages and
          # colleagues' bookmarks — redirect there instead of 404ing.
          redirect() {  # $1 = output path, $2 = target
            printf '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Moved</title>\n<meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s"></head>\n<body><p>This page moved to the <a href="%s">AA tracking site</a>.</p></body></html>\n' "$2" "$2" "$2" > "$1"
          }
          T=https://ocha-dap.github.io/ds-aa-tracking/
          redirect site/anticipatory-action/index.html    "$T"
          redirect site/anticipatory-action/map.html      "$T"
          redirect site/anticipatory-action/triggers.html "${T}dashboards.html"
          redirect site/anticipatory-action/stats.html    "${T}dashboards.html"
          redirect site/anticipatory-action/frameworks/index.html "$T"
          # The root is the team hub (D103) — the AA site is one of its cards, so the pre-D87 root
          # links that used to be redirected still land on a page that leads there in one click.
          cp hub.html site/index.html
          mkdir -p site/db-network && cp db_network.html site/db-network/index.html   # the database network map (D109)
          mkdir -p site/hub && cp -r hub/shots site/hub/shots && cp hub/hub.json site/hub/hub.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
