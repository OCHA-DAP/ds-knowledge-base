name: chd-ds-web-cda-submission-test placeholder

# Temporary. Deploys a placeholder to the chd-ds-web-cda-submission-test Static Web App
# (the test copy of the CDA submission app): every address gets a temporary (302) redirect to
# www.unocha.org until the test copy is built.
# Same placeholder as azure-static-web-apps-orange-coast-043ccba0f.yml (chd-ds-web-main).
#
# TO MOVE: this runs from the KB only because the app's deploy key is here: the Azure portal
# put it in this repo's secrets when TSS created the app on 2026-11-26, and nobody on the team
# can read the key from Azure yet. Once we can, the test copy deploys from its own repo, and
# this file and the secret AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_POND_0F3E2C70F are deleted.
#
# It runs only when this file changes on main, or by hand.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/azure-static-web-apps-witty-pond-0f3e2c70f.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: chd-ds-web-cda-submission-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Write the placeholder
        run: |
          mkdir -p placeholder
          cat > placeholder/staticwebapp.config.json <<'EOF'
          {
            "routes": [
              { "route": "/.auth/login/github", "statusCode": 404 },
              { "route": "/.auth/login/aad", "statusCode": 404 },
              { "route": "/*", "redirect": "https://www.unocha.org/", "statusCode": 302, "headers": { "Cache-Control": "no-store" } }
            ]
          }
          EOF
          cat > placeholder/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=https://www.unocha.org/">
          <title>OCHA</title>
          </head>
          <body><p><a href="https://www.unocha.org/">www.unocha.org</a></p></body>
          </html>
          EOF

      # The portal's template sends a GitHub ID token with the deploy key; kept as it was.
      - name: Get an ID token
        id: idtoken
        uses: actions/github-script@v8
        with:
          result-encoding: string
          script: return await core.getIDToken()

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WITTY_POND_0F3E2C70F }}
          github_id_token: ${{ steps.idtoken.outputs.result }}
          action: upload
          app_location: placeholder
          skip_app_build: true
          skip_api_build: true
