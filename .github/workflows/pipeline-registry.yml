name: Pipeline registry & health

# Refreshes the authoritative prod-pipeline registry + live health
# (infrastructure/pipeline-registry.md + .pipeline-registry.json) by reading live
# Databricks job state + GitHub Actions run history. Generated reference → auto-commits.
# This is the supersede-target for the `pipelines-status` dashboard.
#
# AUTH (repo secrets on ds-knowledge-base — set 2026-08-05):
#   1. Databricks — `DSCI_DATABRICKS_HOST` + `DSCI_DATABRICKS_TOKEN`. These are REPO-level
#      here; `ds-pipelines-status` holds its own separate copies (they are NOT org-level
#      secrets, so the two repos each need their own). The interactive
#      `databricks auth login` token won't work in CI — this must be a PAT/service-principal
#      token, and Databricks PAT scopes are FIXED AT CREATION: a scope-limited token cannot
#      be upgraded in place, it has to be reissued.
#      REQUIRED SCOPES: `jobs` (fatal without it — `jobs list/get/list-runs`) and
#      `clusters` (`personal_cluster_ids()`).
#      ⚠️ The token as of 2026-08-05 has `jobs` but NOT `clusters`. Consequence, and it is a
#      SILENT one: `personal_cluster_ids()` returns empty, so every job pinned to an
#      interactive cluster reads `existing:<id>` and NONE can be classified `personal:<id>`
#      — the **PERSONAL-CLUSTER** WARN in the legend can never fire, even though the board
#      still advertises it. 15 jobs currently sit on `existing:` clusters (incl. `Storm
#      Alert`, which used to carry that flag). An empty personal-cluster column therefore
#      means "not checked", NOT "none found". Add the `clusters` scope to restore it.
#   2. Cross-repo GHA reads — `gh run list -R OCHA-DAP/<other-repo>` needs a token with
#      actions:read across the org. The default GITHUB_TOKEN is scoped to THIS repo only,
#      so set `PIPELINE_REGISTRY_GH_PAT` to an org-read PAT. **OPTIONAL:** without it the
#      Databricks half still works fully and the GHA-half rows just read UNKNOWN (the
#      script never DOWN-flags an unverifiable GHA workflow), so the board degrades safely.
#   3. Some monitoring workflows live on non-default branches → they read UNKNOWN until
#      their path/branch is pinned in GHA_SEED. That's expected, not a failure.
#
# Failure mode to recognise: `ERROR: Databricks returned no jobs — auth not configured?`
# with the secrets clearly present in the run log means the TOKEN SCOPES are wrong, not the
# wiring. The script refuses to overwrite a good registry with an empty one, so a scope
# regression degrades to a stale-but-intact board plus a job warning.
on:
  schedule:
    - cron: "47 6 * * *"   # 06:47 UTC daily (after the DB snapshot)
  workflow_dispatch: {}
  push:
    branches: [local-updaters-ci-registry]   # TEMP-BRANCH-TEST — remove before merge

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      # Pushes straight to main, which the D85 ruleset gates behind a PR — GITHUB_TOKEN is not
      # a bypass actor, the steward App is. (Local launchd runs push as an admin, also a bypass.)
      - name: Mint GitHub App token (ruleset bypass for the auto-commit)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KB_BOT_APP_ID }}
          private-key: ${{ secrets.KB_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks version

      - name: Generate registry + health
        env:
          # Same secrets ds-pipelines-status uses (promote to org-level to share).
          DATABRICKS_HOST: ${{ secrets.DSCI_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DSCI_DATABRICKS_TOKEN }}
          # Empty profile → the script omits `-p` so the CLI uses DATABRICKS_HOST/TOKEN env auth.
          DATABRICKS_PROFILE: ""
          GH_TOKEN: ${{ secrets.PIPELINE_REGISTRY_GH_PAT || secrets.GITHUB_TOKEN }}
        # A generation failure FAILS the job (red on the Actions tab, e-mail to the actor). It used to be
        # downgraded to a ::warning — which hid a 3-week outage (2026-08-13 → 09-02: every run "succeeded"
        # while the registry stayed frozen and the local launchd runner silently kept it alive).
        run: python scripts/gen_pipeline_registry.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/pipeline-registry.md infrastructure/.pipeline-registry.json
          if git diff --staged --quiet; then
            echo "no registry changes"
          else
            git commit -m "chore: refresh pipeline registry + health [skip ci]"
            git push
          fi
