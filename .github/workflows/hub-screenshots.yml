name: Team hub thumbnails

# Refreshes the screenshots on the team hub (the Pages ROOT: every DS dashboard / app / analysis on
# one page — hub.html, generated by scripts/gen_team_hub.py from the committed registries). The hub
# itself is regenerated on every deploy by site.yml with no network; this is the one part that needs
# a browser: a headless Chromium captures a 640×400 thumbnail of every public, live card
# (scripts/hub_screenshots.py) and commits them under hub/shots/. Committed WITHOUT [skip ci] on
# purpose, so the deploy picks the new thumbnails up straight away.
#
# Weekly is enough — the pictures are for recognition, not for reading today's values.

on:
  schedule:
    - cron: "40 5 * * 1"   # Mondays 05:40 UTC (before the weekday registries refresh)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-capture every card even if its shot is fresh"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hub-screenshots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pushes straight to main, which the D85 ruleset gates behind a PR — GITHUB_TOKEN is not
      # a bypass actor, the steward App is.
      - name: Mint GitHub App token (ruleset bypass for the auto-commit)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KB_BOT_APP_ID }}
          private-key: ${{ secrets.KB_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml playwright
      - run: python -m playwright install --with-deps chromium

      - name: Rebuild the inventory from the committed registries
        run: python scripts/gen_team_hub.py

      - name: Capture thumbnails
        run: python scripts/hub_screenshots.py --prune ${{ inputs.force && '--force' || '' }}

      - name: Rebuild the hub page so it references the new thumbnails
        run: python scripts/gen_team_hub.py

      - name: Commit thumbnails + hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hub hub.html
          if git diff --staged --quiet; then
            echo "no thumbnail changes"
          else
            git commit -m "chore: refresh team-hub thumbnails"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
