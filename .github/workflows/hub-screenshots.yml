name: Team hub thumbnails

# Refreshes the screenshots on the team hub (the Pages ROOT: every DS dashboard / app / analysis on
# one page — hub.html, generated by scripts/gen_team_hub.py from the committed registries). The hub
# itself is regenerated on every deploy by site.yml with no network; this is the one part that needs
# a browser: a headless Chromium captures a 640×400 thumbnail of every public, live card
# (scripts/hub_screenshots.py) and commits them under hub/shots/. Committed WITHOUT [skip ci] on
# purpose, so the deploy picks the new thumbnails up straight away — but ONLY when a shot actually
# changed (the regenerated hub.html carries a build timestamp, so it alone is never a reason to push).
#
# Weekly is enough — the pictures are for recognition, not for reading today's values.
#
# Token hygiene: Chromium visits ~80 URLs, some auto-declared, so the capture runs with the default
# read-only GITHUB_TOKEN; the steward App token (the D85 ruleset bypass for pushing to main) is
# minted only AFTER the browser has closed, for the push alone.

on:
  schedule:
    - cron: "40 5 * * 1"   # Mondays 05:40 UTC (before the weekday registries refresh)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-capture every card even if its shot is fresh"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hub-screenshots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install --quiet pyyaml playwright
      - run: python -m playwright install --with-deps chromium

      - name: Rebuild the inventory from the committed registries
        run: python scripts/gen_team_hub.py

      - name: Capture thumbnails
        run: python scripts/hub_screenshots.py --prune ${{ inputs.force && '--force' || '' }}

      - name: Anything to publish?
        id: changed
        run: |
          git add hub/shots
          if git diff --staged --quiet -- hub/shots; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no thumbnail changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"; git diff --staged --stat -- hub/shots | tail -1
          fi

      # Pushes straight to main, which the D85 ruleset gates behind a PR — GITHUB_TOKEN is not
      # a bypass actor, the steward App is. Minted after the capture so the browser never ran
      # with it in the environment.
      - name: Mint GitHub App token (ruleset bypass for the auto-commit)
        if: steps.changed.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KB_BOT_APP_ID }}
          private-key: ${{ secrets.KB_BOT_APP_PRIVATE_KEY }}

      - name: Rebuild the hub page so it references the new thumbnails, commit, push
        if: steps.changed.outputs.changed == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python scripts/gen_team_hub.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add hub hub.html
          git commit -m "chore: refresh team-hub thumbnails"
          # main moves often here (scheduled + push runs + other auto-commits) — rebase + retry
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && { echo "pushed"; break; } \
              || { echo "push attempt $i failed; retrying"; perl -e 'select(undef,undef,undef,5)'; }
          done
