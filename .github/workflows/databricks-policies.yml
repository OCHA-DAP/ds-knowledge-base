# Mirrors the workspace's cluster policies into infrastructure/databricks-policies/ (D114).
# Databricks is the source of truth; this commits whatever the workspace currently holds.
name: Databricks policy mirror
on:
  schedule:
    - cron: "57 6 * * *"   # 06:57 UTC daily, after the pipeline registry
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (ruleset bypass for the auto-commit)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KB_BOT_APP_ID }}
          private-key: ${{ secrets.KB_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks version
      - name: Mirror policies
        env:
          DATABRICKS_HOST: ${{ secrets.DSCI_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DSCI_DATABRICKS_TOKEN }}
          DATABRICKS_PROFILE: ""
        run: python scripts/gen_databricks_policies.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A infrastructure/databricks-policies
          if git diff --staged --quiet; then
            echo "no policy changes"
          else
            git commit -m "chore: refresh Databricks policy mirror [skip ci]"
            git push
          fi
