# Weekly KB usage digest → `kb-usage` tracking issue.
#
# The digest itself (scripts/analyze_usage.py over kb_usage.events, 30-day
# window) is produced daily by the `KB DB Snapshot` Databricks job — GitHub
# runners can't reach the database — and parked on the dev blob next to the
# schema snapshot. This workflow downloads it; the manifest's `usage_exit`
# (2 = actionable signals) decides whether the issue is opened / refreshed.
name: KB usage review
on:
  schedule:
    - cron: "23 7 * * 1"   # Mondays 07:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download the digest from blob (written by the KB DB Snapshot Databricks job)
        id: digest
        env:
          SAS: ${{ secrets.DSCI_AZ_BLOB_DEV_SAS }}
        run: |
          test -n "$SAS" || { echo "::error::DSCI_AZ_BLOB_DEV_SAS org secret is not visible to this repo"; exit 1; }
          base="https://imb0chd0dev.blob.core.windows.net/projects/ds-knowledge-base/db-snapshot/latest"
          curl -fsS -o manifest.json "$base/manifest.json?${SAS#\?}"
          curl -fsS -o usage-digest.md "$base/usage-digest.md?${SAS#\?}"
          python3 scripts/db_snapshot_blob.py check --to . --max-age-hours 36
          echo "actionable=$(python3 -c "import json; print(str(json.load(open('manifest.json')).get('usage_exit') == 2).lower())")" >> "$GITHUB_OUTPUT"

      - name: Open/update tracking issue
        if: steps.digest.outputs.actionable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create kb-usage --color 1D76DB --description "Usage-driven KB/MCP improvements" 2>/dev/null || true
          body="$(cat usage-digest.md)"
          num=$(gh issue list --label kb-usage --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            printf '%s\n' "$body" | gh issue edit "$num" --body-file -
            echo "Updated usage issue #$num"
          else
            printf '%s\n' "$body" | gh issue create --title "KB usage: improvement digest" --label kb-usage --body-file -
          fi
