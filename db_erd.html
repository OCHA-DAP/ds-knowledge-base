<div class="app" id="app">
  <header class="bar">

        </div>
      </div>
      <div class="fgroup"><span>Joins</span>
        <div class="seg" id="seg-edges" role="group" aria-label="Which joins to draw">
          <button data-v="fk" aria-pressed="true" title="Foreign keys the database enforces"><svg viewBox="0 0 22 8"><path d="M0 4H22"/></svg>Declared</button>
          <button data-v="conv" aria-pressed="true" title="Same key, no constraint: joins by convention"><svg viewBox="0 0 22 8"><path d="M0 4H22" stroke-dasharray="5 3"/></svg>By convention</button>
          <button data-v="hub" aria-pressed="false" title="Joins into tables almost everything points at">Hub joins</button>
          <button data-v="view" aria-pressed="false" title="Which relations each view reads"><svg viewBox="0 0 22 8"><path d="M0 4H22" stroke-dasharray="1.5 3.5"/></svg>View lineage</button>
        </div>
      </div>
      <div class="fgroup"><span>Cards</span>
        <div class="seg" id="seg-density" role="group" aria-label="Card detail">
          <button data-v="names" aria-pressed="false">Names</button><button data-v="keys" aria-pressed="true">Keys</button>
        </div>
      </div>
      <button class="btn" id="btn-expand">Expand all</button>
      <button class="btn" id="btn-collapse">Collapse all</button>
      <button class="btn" id="btn-notes">Notes</button>
    </div>
  </header>
  <div class="legend" id="legend"></div>
  <div class="main">
    <aside class="outline" id="outline" aria-label="Tables">
      <div class="find"><input id="q" type="search" placeholder="Find a table or column  ( / )" autocomplete="off" spellcheck="false" aria-label="Find a table or column"></div>
      <nav class="tree" id="tree"></nav>
    </aside>
    <div class="vp" id="vp">
      <div class="stage" id="stage"></div>
      <div class="zoomctl">
        <button id="z-in" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="z-out" aria-label="Zoom out" title="Zoom out">&minus;</button>
        <button id="z-fit" aria-label="Fit the whole map" title="Fit the whole map (F)">&#9974;</button>
        <div class="pct" id="z-pct"></div>
      </div>
      <div class="hint">Drag to pan · scroll or pinch to zoom · click a table for its columns and joins</div>
      <canvas class="mini" id="mini" width="200" height="120" aria-hidden="true"></canvas>
      <aside class="drawer" id="drawer" hidden></aside>
    </div>
  </div>
</div>
<dialog id="notes"><div class="dlg" id="notes-body"></div></dialog>

<script>

}

// ------------------------------------------------------------------ layout
function layoutGroup(g) {
  if (st.collapsed.has(g.id)) return { w: 268, h: M.gHead + 24, pos: {}, collapsed: true };
  const tabs = g.tables.filter(id => !isView(T[id])), views = g.tables.filter(id => isView(T[id])).sort();
  const inSet = new Set(tabs), par = {}, kid = {};
  tabs.forEach(i => { par[i] = []; kid[i] = []; });
  for (const e of D.edges) {
    if ((e.k === "fk" || e.k === "conv") && e.a !== e.b && inSet.has(e.a) && inSet.has(e.b) && !par[e.a].includes(e.b)) { par[e.a].push(e.b); kid[e.b].push(e.a); }
  }
  const depth = {}, visiting = new Set();
  const dep = id => {
    if (id in depth) return depth[id];
    if (visiting.has(id)) return 0;
    visiting.add(id);
    let d = 0;
    for (const p of par[id]) d = Math.max(d, dep(p) + 1);
    visiting.delete(id);
    return (depth[id] = d);
  };
  tabs.forEach(dep);
  const linked = tabs.filter(i => par[i].length || kid[i].length), loose = tabs.filter(i => !par[i].length && !kid[i].length);
  const pos = {}, columns = [];          // columns: {ids, gap}
  const pack = (ids, maxH, firstGap) => {
    let cur = [], h = 0, first = true;
    for (const id of ids) {
      const ch = cardH(T[id]);
      if (cur.length && h + ch > maxH) { columns.push({ ids: cur, gap: first ? firstGap : M.subGap }); first = false; cur = []; h = 0; }
      cur.push(id); h += ch + M.rowGap;
    }
    if (cur.length) columns.push({ ids: cur, gap: first ? firstGap : M.subGap });
  };
  const maxD = linked.reduce((m, i) => Math.max(m, depth[i]), -1);
  const yMid = {};
  for (let d = 0; d <= maxD; d++) {
    const ids = linked.filter(i => depth[i] === d);
    if (d === 0) ids.sort((a, b) => kid[b].length - kid[a].length || a.localeCompare(b));
    else {
      const bc = i => { const ps = par[i].filter(p => p in yMid); return ps.length ? ps.reduce((s, p) => s + yMid[p], 0) / ps.length : 1e9; };
      ids.sort((a, b) => bc(a) - bc(b) || a.localeCompare(b));
    }
    const before = columns.length;
    pack(ids, st.colMax, M.colGap);
    for (let c = before; c < columns.length; c++) { let y = 0; for (const id of columns[c].ids) { const h = cardH(T[id]); yMid[id] = y + h / 2; y += h + M.rowGap; } }
  }
  if (loose.length) pack(loose.sort((a, b) => (T[a].k === "g") - (T[b].k === "g") || a.localeCompare(b)), Math.min(st.colMax, M.colH), M.colGap);
  if (views.length) pack(views, st.colMax, M.colGap);
  let x = 0, hMax = 0;
  columns.forEach((c, ci) => {
    if (ci) x += c.gap;
    let y = 0;
    for (const id of c.ids) { const h = cardH(T[id]); pos[id] = { x, y, w: M.cardW, h }; y += h + M.rowGap; }
    hMax = Math.max(hMax, y - M.rowGap);
    x += M.cardW;
  });
  return { w: Math.max(x, 230) + 2 * M.gPad, h: M.gHead + Math.max(hMax, 20) + M.gPad, pos, collapsed: false };
}

function layoutAll(W) {
  const GL = {};
  for (const g of Object.values(G)) GL[g.id] = layoutGroup(g);
  const rows = {};
  D.regions.forEach(r => (rows[r.row] = rows[r.row] || []).push(r));
  const regs = {};
  const packRegion = (r, wrapW) => {
    const tallest = Math.max(260, ...r.groups.map(gid => GL[gid].h));
    const stack = target => {
      const out = [];
      for (const gid of r.groups) {
        const gl = GL[gid], cur = out[out.length - 1];
        if (cur && cur.h + M.gGap + gl.h <= target) { cur.items.push({ gid, y: cur.h + M.gGap }); cur.h += M.gGap + gl.h; cur.w = Math.max(cur.w, gl.w); }
        else out.push({ w: gl.w, h: gl.h, items: [{ gid, y: 0 }] });
      }
      return out;
    };
    let stacks = stack(tallest);
    for (const f of [0, 0.5, 0.75]) {
      const cand = stack(tallest * f);
      if (cand.reduce((s, k) => s + k.w + M.gGap, -M.gGap) <= wrapW) { stacks = cand; break; }
    }
    let x = 0, y = 0, rowH = 0, maxW = 0;
    const gpos = {};
    for (const sk of stacks) {
      if (x > 0 && x + sk.w > wrapW) { x = 0; y += rowH + M.gGap; rowH = 0; }
      for (const it of sk.items) gpos[it.gid] = { x, y: y + it.y };
      x += sk.w + M.gGap; rowH = Math.max(rowH, sk.h); maxW = Math.max(maxW, x - M.gGap);
    }
    return { w: Math.max(maxW, 300) + 2 * M.rPad, h: M.rHead + y + rowH + M.rPad, gpos };
  };
  let yCur = 0, wMax = 0;
  const rowBoxes = [];
  for (const rk of Object.keys(rows).map(Number).sort((a, b) => a - b)) {
    const rs = rows[rk];
    const area = r => r.groups.reduce((s, gid) => s + GL[gid].w * GL[gid].h, 0) + 40000;
    const total = rs.reduce((s, r) => s + area(r), 0);
    const avail = W - (rs.length - 1) * M.rGap;
    let x = 0, hRow = 0;
    const placed = [];
    for (const r of rs) {
      const widest = r.groups.reduce((m, gid) => Math.max(m, GL[gid].w), 0);
      const p = packRegion(r, Math.max(widest, avail * area(r) / total - 2 * M.rPad));
      placed.push({ r, p, x });
      x += p.w + M.rGap; hRow = Math.max(hRow, p.h);
    }
    rowBoxes.push({ placed, y: yCur, h: hRow, w: x - M.rGap });
    wMax = Math.max(wMax, x - M.rGap);
    yCur += hRow + M.rowGap2;
  }
  const abs = {}, grp = {};
  for (const rb of rowBoxes) {
    const extra = (wMax - rb.w) / rb.placed.length;
    rb.placed.forEach((pl, i) => {
      const rx = pl.x + extra * i;
      regs[pl.r.id] = { x: rx, y: rb.y, w: pl.p.w + extra, h: rb.h };
      for (const gid of pl.r.groups) {
        const gp = pl.p.gpos[gid], gl = GL[gid];
        const gx = rx + M.rPad + gp.x, gy = rb.y + M.rHead + gp.y;
        grp[gid] = { x: gx, y: gy, w: gl.w, h: gl.h, collapsed: gl.collapsed };
        for (const id in gl.pos) { const p = gl.pos[id]; abs[id] = { x: gx + M.gPad + p.x, y: gy + M.gHead + p.y, w: p.w, h: p.h }; }
      }
    });
  }
  const H = yCur - M.rowGap2, used = Object.values(grp).reduce((s, g) => s + g.w * g.h, 0);
  return { W: wMax, H, regs, grp, abs, fill: used / (wMax * H) };
}

// Pick the canvas width and the tallest allowed column so the whole map has roughly the window's shape
// and wastes the least space. Called at load and by expand / collapse all, not on every small change.
function chooseShape() {
  const want = clamp(vp.clientWidth / Math.max(vp.clientHeight, 200), 0.6, 2.4);
  let best = null;
  for (const colMax of [440, 540, 660, 800, 960, 1150]) {
    st.colMax = colMax;
    for (let w = 2200; w <= 8200; w += 300) {
      const l = layoutAll(w), err = Math.abs(Math.log((l.W / l.H) / want)) + 1.1 * (1 - l.fill);
      if (!best || err < best.err) best = { w, colMax, err };

  }
  st.colMax = best.colMax; st.W = best.w;

// ------------------------------------------------------------------ render
const node = id => (id in L.abs ? { rect: L.abs[id], kind: "t", id } : { rect: L.grp[T[id].g], kind: "g", id: T[id].g });
function anchorY(n, tid, cols) {
  if (n.kind === "g") return n.rect.y + 16;

  if (i < 0) return n.rect.y + M.head / 2 + 2;

    + `M${x1 + d1 * 9},${ay}L${x1},${ay - 5}M${x1 + d1 * 9},${ay}L${x1},${ay + 5}`     // crow's foot: the "many" end

function cardHTML(t, p) {

  }

  h += `<div class="cs"><span class="sc">${esc(t.s)}</span>${isView(t) ? `<span>· ${t.k === "m" ? "materialised view" : "view"}</span>` : ""}${t.role ? `<span>· ${esc(t.role)}</span>` : ""}`

function groupMeta(g) {
  const bits = [];

}
function groupCount(g) {

function render() {
  const h = [], far = [];
  for (const r of D.regions) {
    const b = L.regs[r.id], n = r.groups.reduce((s, gid) => s + G[gid].tables.filter(i => T[i].k !== "g").length, 0);
    h.push(`<section class="reg" data-r="${esc(r.id)}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;--c:${C[r.cls].color}">`
      + `<div class="rh"><div><div class="rt">${esc(r.label)}</div><div class="rn">${esc(r.note || "")}</div></div></div>`
      + "</section>");
    far.push(`<div class="rfar" data-r="${esc(r.id)}" data-len="${r.label.length}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px"><span>${esc(r.label)}</span><small>${n ? n + " relations" : "not mirrored"}</small></div>`);
  }
  for (const g of Object.values(G)) {
    const b = L.grp[g.id], diff = g.cls !== R[g.region].cls;
    const bytes = g.tables.reduce((s, i) => s + (T[i].st.dev || T[i].st.prod || [0, 0])[1], 0);
    h.push(`<div class="grp${diff ? " diff" : ""}" data-g="${esc(g.id)}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px;--c:${C[g.cls].color}">`
      + `<div class="gh"><i class="dot"></i><span class="gl" title="${esc(g.label)}">${esc(g.label)}</span>`
      + `<button class="gx" data-gx="${esc(g.id)}" aria-label="${b.collapsed ? "Expand" : "Collapse"} ${esc(g.label)}" title="${b.collapsed ? "Expand" : "Collapse"}">${b.collapsed ? "▸" : "▾"}</button>`
      + `<span class="gm">${esc(groupMeta(g))}</span></div>`
      + (b.collapsed ? `<div class="gsum">${esc(groupCount(g))}${bytes ? " · " + fmtBytes(bytes) : ""}</div>` : "") + "</div>");
  }
  const cards = [];
  for (const id in L.abs) cards.push(cardHTML(T[id], L.abs[id]));

  // edges: a collapsed group stands in for its tables; parallel edges between the same two boxes merge
  const paths = [], seen = {};
  L.edges = [];
  D.edges.forEach((e, i) => {

  });

  stage.innerHTML = h.join("") + svg(paths.join(""), "") + cards.join("") + far.join("") + svg('<g id="elabs"></g>', " top");
  stage.style.width = L.W + "px"; stage.style.height = L.H + "px";

function relayout(anchor) {            // anchor: {sel:'[data-g="x"]'} keeps that element where it is on screen
  let before = null;

  }

// ------------------------------------------------------------------ view (pan / zoom)

  stage.style.setProperty("--gk", clamp(0.8 / st.k, 1, 3.3).toFixed(3));

    for (const el of $$(".rfar", stage)) {

      el.style.fontSize = Math.min(20 / st.k, (b.w * 0.9) / (Number(el.dataset.len) * 0.55 + 1), b.h * 0.2).toFixed(1) + "px";
    }

}
function zoomAt(cx, cy, k) {

let anim = 0;

const fitAll = () => flyToRect({ x: 0, y: 0, w: L.W, h: L.H }, 1, 24);

  if (cv.width !== w * dpr || cv.height !== hh * dpr) { cv.width = w * dpr; cv.height = hh * dpr; cv.style.width = w + "px"; cv.style.height = hh + "px"; }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, hh);

}

// ------------------------------------------------------------------ selection
const drawer = $("#drawer");

const miniGo = ev => { const r = mini.getBoundingClientRect(), s = mini._s; st.tx = vp.clientWidth / 2 - ((ev.clientX - r.left) / s) * st.k; st.ty = vp.clientHeight / 2 - ((ev.clientY - r.top) / s) * st.k; applyView(); };
mini.addEventListener("pointerdown", ev => { ev.stopPropagation(); mini.setPointerCapture(ev.pointerId); miniGo(ev); mini._d = true; });
mini.addEventListener("pointermove", ev => { if (mini._d) miniGo(ev); });
mini.addEventListener("pointerup", () => { mini._d = false; });
window.addEventListener("keydown", ev => {
  if (ev.target.matches("input,textarea")) { if (ev.key === "Escape") ev.target.blur(); return; }
  if ($("#notes").open) return;
  if (ev.key === "/") { ev.preventDefault(); $("#outline").classList.remove("closed"); $("#q").focus(); }
  else if (ev.key === "Escape") select(null);
  else if (ev.key === "f" || ev.key === "0") fitAll();
  else if (ev.key === "+" || ev.key === "=") zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, st.k * 1.25);
  else if (ev.key === "-") zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, st.k / 1.25);
  else if (ev.key.startsWith("Arrow")) { const d = 80; st.tx += ev.key === "ArrowLeft" ? d : ev.key === "ArrowRight" ? -d : 0; st.ty += ev.key === "ArrowUp" ? d : ev.key === "ArrowDown" ? -d : 0; applyView(); }
});
window.addEventListener("resize", () => drawMini());

// ------------------------------------------------------------------ go
if (window.innerWidth < 900) { $("#outline").classList.add("closed"); $("#tgl-outline").setAttribute("aria-pressed", "false"); }
renderLegend(); renderNotes(); applyEdgeToggles();
chooseShape();
L = layoutAll(st.W);
render(); renderTree();
{ const k = Math.min(vp.clientWidth / (L.W + 48), vp.clientHeight / (L.H + 48), 1); st.k = k; st.tx = (vp.clientWidth - L.W * k) / 2; st.ty = (vp.clientHeight - L.H * k) / 2; applyView(); }
function fromHash() {
  const m = /^#([tgr])=(.+)$/.exec(location.hash);
  if (!m) return;
  let id;
  try { id = decodeURIComponent(m[2]); } catch (e) { return; }
  if (st.sel && st.sel.type === m[1] && st.sel.id === id) return;
  if ((m[1] === "t" && T[id]) || (m[1] === "g" && G[id]) || (m[1] === "r" && R[id])) select({ type: m[1], id }, true);
}
window.addEventListener("hashchange", fromHash);
fromHash();
})();
