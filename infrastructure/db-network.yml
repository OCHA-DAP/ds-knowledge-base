# Curated overlay for the DSCI Database Network map (scripts/gen_db_network.py → db_network.html,
# served at /db-network/). Everything STRUCTURAL on the map is derived from page frontmatter, the
# DB table snapshots and the pipeline registry; this file holds only what cannot be derived:
# table groupings, impact statements, role/framework overrides, and nodes that have no KB page.
#
# A page that touches the DB but has no `impact:` here is still drawn — with a placeholder — and
# listed under "Unreviewed" in the map's Notes so the gap is visible. Add the entry; don't hide it.

# Table groups: the rows inside the prod / dev boxes. A table not covered by any group falls into an
# automatic "<schema>.* (<db>)" group, so nothing is dropped. `match` entries are exact ids or
# `schema.prefix*` globs against the snapshot table lists.
groups:
  - id: t_raster
    db: prod
    label: "public.era5 · seas5 · imerg · floodscan · polygon"
    match: [public.era5, public.seas5, public.imerg, public.floodscan, public.polygon, public.iso3, public.qa, "public.*_completeness"]
    links:
      - {label: "KB · prod schema snapshot", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-schema.md#public"}
  - id: t_storms
    db: prod
    label: "storms.* — NHC tracks, exposure, WSP · IBTrACS · ECMWF · GDACS/ADAM"
    match: ["storms.*"]
    links:
      - {label: "KB · prod schema snapshot", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-schema.md#storms"}
      - {label: "KB · ER diagrams", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-erd.md"}
  - id: t_flood
    db: prod
    label: "app.floodscan_exposure · quantile · admin_lookup"
    match: ["app.*"]
    links:
      - {label: "KB · prod schema snapshot", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-schema.md#app"}
  - id: t_storms_dev
    db: dev
    label: "storms.* (dev — public access disabled 2026-09-22)"
    match: ["storms.*"]
    links:
      - {label: "KB · dev schema snapshot", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-schema-dev.md"}
      - {label: "KB · ER diagrams", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-erd.md"}
  - id: t_aa
    db: dev
    label: "aa.cerf_* · cbpf_* · framework registry"
    match: ["aa.*", "cbpf.*"]
    links:
      - {label: "KB · dev schema snapshot", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-schema-dev.md"}
      - {label: "KB · ER diagrams", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-erd.md"}
  - id: t_ref
    db: dev
    label: "ipc.* · fewsnet.* · hpc.* · pop.*"
    match: ["ipc.*", "fewsnet.*", "hpc.*", "pop.*"]
    links:
      - {label: "KB · dev schema snapshot", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/db-schema-dev.md"}
  - id: t_proj
    db: dev
    label: "projects.*"
    match: ["projects.*"]
  - id: t_kb
    db: dev
    label: "kb_usage.events"
    match: ["kb_usage.*"]
    links:
      - {label: "KB · usage telemetry", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/usage.md"}
  - id: t_devraster
    db: dev
    label: "public.* (dev copies)"
    match: ["public.*"]

# Pages that touch the DB but are deliberately left off the map (reason is the value).
ignore:
  pipelines-status: "meta-dashboard being superseded by the pipeline registry; reads prod introspection only"
  raster-pipelines: "folded into raster-stats (same four Databricks jobs; see merge below)"
  imerg: "superseded GHA; the live IMERG writer is the raster-stats Databricks job"
  data-validation-app: "Azure app stopped 2026-08-06"
  raster-stats-app: "retired"
  seasonal-bulletin: "Azure app slots stopped"
  glb-tropicalcyclones: "manual notebooks — represented by the 'Analysis notebooks' node"
  nhc-forecast: "its page records blob CSV outputs only; the registry's 'intended prod NHC writer' note is aspirational and the workflow has been failing since 2026-06"

# Per-page overrides, keyed by the page stem (pipelines/<stem>.md or apps/<stem>.md).
#   label/meta      display name and one-line description on the card
#   role            backend | monitor | other   (default: type==monitoring → monitor; writes-only → backend; else other)
#   framework       frameworks/<folder> this monitor implements (default: any framework page whose depends_on names this page)
#   merge           other page stems folded into this node
#   reads/writes    extra table-group ids the frontmatter text does not name
#   unverified      a short reason the DB dependency is not confirmed
#   impact          what stops if the DB connection is cut (REQUIRED for a reviewed node)
#   links           extra {label,url} chips
#   lists / list_tags   the PRODUCTION Listmonk list ids (or list tags) this pipeline sends to — recipient
#                   counts come from infrastructure/.listmonk-lists.json (gen_listmonk_lists.py); test lists are left out
nodes:
  raster-stats:
    label: raster-stats jobs
    meta: "Run ERA5 · SEAS5 · IMERG · FloodScan"
    role: backend
    merge: [raster-pipelines]
    impact: "The zonal-statistics backbone. Every SEAS5, ERA5, IMERG and FloodScan consumer goes stale: the Haiti rainfall check, Madagascar, Ethiopia, seas5-viz, seas5-skill and the seasonal bulletin."
  storms-pipeline:
    meta: "NHC · GDACS/ADAM 3-hourly · IBTrACS · ECMWF daily"
    role: backend
    impact: "The tropical-storm backbone. Haiti and Cuba monitors, storms-alerts, the GDACS email and the cerf-supplement storm matcher lose fresh tracks and wind exposure within one 3-hour advisory cycle."
  floodexposure-monitoring:
    meta: "FloodScan × WorldPop exposure"
    role: backend
    impact: "Daily exposure stops landing. The Nigeria flash trigger, the public flood-exposure dashboard and the Cameroon flooding analysis go stale the same day."
  cerf-supplement:
    meta: "OneGMS + CBPF mirrors, storm matcher"
    role: backend
    impact: "OneGMS and CBPF mirrors stop refreshing, so every CERF allocation table in the aa schema freezes. aa-tracking, teleconnections and the KB framework pages read from it."
  ipc-mirror:
    label: "Reference mirrors ×4"
    meta: "ipc · fewsnet · hnrp · population"
    role: backend
    merge: [fewsnet-mirror, hnrp-mirror, population-mirror]
    impact: "Third-party reference mirrors stop updating and their published sites stop rebuilding. No live trigger depends on them today."
  aa-tracking:
    meta: "AA portfolio + CERF funding registry"
    role: backend
    impact: "The AA portfolio and CERF funding registry cannot be reloaded from a laptop; the encrypted review site stops being rebuildable."
  hti-hurricanes-monitoring:
    lists: [116, 117]
    meta: "4×/day after each NHC advisory"
    role: monitor
    runtime: [dbx]
    framework: hti-hurricanes
    impact: "Wind-exposure and rainfall trigger evaluation stops every advisory cycle. Subscriber emails, the DGPC department pages and the advisory map stop updating."
  mdg-monitoring:
    lists: [109]
    meta: "3-day IMERG rainfall check"
    role: monitor
    framework: mdg-storms
    impact: "The Madagascar storms rainfall trigger stops being evaluated; no email during the Nov–Apr season, so an activation would have to be spotted by hand."
  eth-drought-monitoring:
    lists: [104]
    meta: "SEAS5 MAM / JJAS trigger"
    role: monitor
    framework: eth-drought
    impact: "Trigger emails fail at the three run dates. A missing SEAS5 read is treated as \"no data\" and the email is skipped silently rather than erroring."
  nga-flooding-monitoring:
    meta: "flash + riverine triggers"
    role: monitor
    framework: nga-flooding
    impact: "The flash trigger has one data source, the prod exposure table, so it stops. The riverine monitor can fetch GloFAS but cannot persist forecasts, breaking the published pages."
  moz-cyclones-monitoring:
    meta: "Postgres use unverified"
    role: monitor
    framework: moz-cyclones
    reads: [t_storms]
    unverified: "the page lists \"Azure Blob + Postgres\" as a dependency but names no table; drawn against the storms tables as a guess"
    impact: "If it does read the database, the Mozambique cyclone trigger checks stop during Nov–Apr. Needs verification in the repo."
  storms-alerts:
    list_tags: [ds-storms-alerts]
    meta: "global storm exposure emails"
    role: other
    impact: "Global storm exposure alert emails stop after every NHC advisory. Not a framework trigger, but the team's main outward storm notification."
  storm-impact-harmonisation:
    meta: "GDACS email · PDC poll · compare site"
    role: other
    impact: "GDACS monitor email and the storm-exposure-compare data export stop."
  floodexposure-monitoring-app:
    label: floodexposure dashboard
    meta: chd-ds-floodexposure-monitoring
    role: other
    impact: "Public flood-exposure dashboard stops rendering data until the App Service gets VNet integration."
  seas5-viz:
    label: "seas5-viz · seas5-skill"
    meta: "chd-ds-seas5-viz · chd-ds-seas5-skill"
    role: other
    merge: [seas5-skill]
    impact: "seas5-viz fails on every query. seas5-skill serves cached data until its next restart or monthly refresh, then fails."
  teleconnections:
    meta: "site build"
    role: other
    impact: "Site rebuilds fail. No operational trigger affected."
  ken-drought-monitoring:
    lists: [105]
    meta: "NDMA drought indicators → trigger email"
    role: monitor
    framework: ken-drought
    impact: "The Kenya drought trigger email cannot be sent. The pipeline itself reads an uploaded input file, not the database; its only database exposure is Listmonk."
  som-floods-monitoring:
    meta: "GloFAS + Google flood forecasts → daily email"
    role: monitor
    impact: "Daily Somalia flood monitoring emails stop; the blob-side monitoring record and public pages keep updating."
  moz-cholera-monitoring:
    lists: [102]
    meta: "cholera case thresholds → alert email"
    role: monitor
    framework: moz-cholera
    impact: "Mozambique cholera trigger alerts cannot be sent."
  fms-tc-outlook:
    lists: [9]
    meta: "Fiji Met Service TC outlook scrape → email"
    role: other
    impact: "Fiji tropical-cyclone outlook emails stop."
  rosea-thresholds-monitoring:
    lists: [13, 6]
    meta: "IPC thresholds → email on PR merge"
    role: other
    impact: "ROSEA threshold emails cannot be sent."
  afro-cholera:
    lists: [18]
    meta: "global cholera alerts"
    role: other
    impact: "Global cholera alert emails stop (already overdue at the last registry snapshot)."
  storm-exposure-compare:
    meta: "static export from the dev DB at deploy time"
    role: other
    impact: "The compare site stops refreshing its daily JSON export; the published page keeps serving the last export."

# Shared services that sit between a database and the pipelines that call them. Each becomes a backend
# node writing its own table group, and every page whose `depends_on` names `key` is drawn as a consumer
# reading that group (tagged "via <label>") — so a service outage propagates through the map like a
# table outage. Frameworks whose page depends on the service directly are linked straight to the group.
services:
  - key: listmonk
    id: listmonk
    label: Listmonk
    meta: "email campaigns · VNet-integrated Azure web app"
    runtime: [web]
    group:
      id: t_listmonk
      db: dev
      label: "listmonk database (Listmonk's own tables)"
      tables: [listmonk.subscribers, listmonk.lists, listmonk.subscriber_lists, listmonk.campaigns, listmonk.templates, listmonk.media, listmonk.users]
      links:
        - {label: "KB · comms-listmonk", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/comms-listmonk.md"}
    tables: "reads and writes its own `listmonk` database on the dev server chd-rasterstats-dev (role listmonk_service); migration to prod is a deferred TODO on the comms-listmonk page"
    impact: "Every trigger and alert email the team sends goes through Listmonk, and its database is on the dev server. When dev lost public access on 2026-09-22 Listmonk went down with it (storms-alerts fell back to direct SMTP). Moving the listmonk database to prod, or giving the app a private route, is what keeps the whole right-hand column emailing."
    links:
      - {label: "Listmonk (Azure app)", url: "https://listmonk-demo-afhcg8e2hde0fxca.eastus2-01.azurewebsites.net"}
      - {label: "KB · comms-listmonk", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/comms-listmonk.md"}

# Nodes with no KB page of their own.
#   runtime: gha | dbx | web | man (one or more) · reads/writes: table-group ids · repo: OCHA-DAP/<repo> (optional)
extra_nodes:
  - id: cub-hurricanes-monitor
    label: "Cuba hurricane monitors"
    meta: "Databricks observational + GHA workflows"
    role: monitor
    framework: cub-hurricanes
    runtime: [dbx, gha]
    reads: [t_storms_dev]
    repo: OCHA-DAP/ds-aa-cub-hurricanes
    tables: "reads storms.nhc_tracks_geo ⨝ storms.nhc_storms — the framework page (2025-08-26 version) says the dev database; ds-storms-pipeline moved those tables to prod on 2026-09-22"
    impact: "NHC tracks come from the storms database, not the old blob CSVs. If the monitors still point at dev they are already broken since 2026-09-22; the Databricks observational monitor was failing at the last registry snapshot."
    links:
      - {label: "Workflow · 01_run_forecast_data_ingestion.yml", url: "https://github.com/OCHA-DAP/ds-aa-cub-hurricanes/actions/workflows/01_run_forecast_data_ingestion.yml"}
      - {label: "Workflow · 02_run_observational_data_ingestion.yml", url: "https://github.com/OCHA-DAP/ds-aa-cub-hurricanes/actions/workflows/02_run_observational_data_ingestion.yml"}
  - id: kb-services
    label: "KB MCP servers · chatbot · KB workflows"
    meta: "usage telemetry, run_sql, schema snapshots"
    role: other
    runtime: [web, gha]
    reads: [t_aa, t_raster]
    writes: [t_kb]
    repo: OCHA-DAP/ds-knowledge-base
    tables: "writes kb_usage.events (dev); internal run_sql reads prod + dev; db-schema, trigger-stats, aa-links workflows read prod + dev"
    impact: "Usage telemetry no-ops, the internal SQL tool times out, and the daily schema snapshots and dependency graph stop refreshing."
    links:
      - {label: "Workflow · db-schema.yml", url: "https://github.com/OCHA-DAP/ds-knowledge-base/actions/workflows/db-schema.yml"}
      - {label: "Workflow · trigger-stats.yml", url: "https://github.com/OCHA-DAP/ds-knowledge-base/actions/workflows/trigger-stats.yml"}
      - {label: "KB chatbot", url: "https://chd-ds-kb-chat.azurewebsites.net"}
      - {label: "KB · MCP connectors", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/mcp-connectors.md"}
  - id: unidentified-apps
    label: "storms-explore · aa-extract"
    meta: "running Azure apps with no KB page"
    role: other
    runtime: [web]
    reads: [t_storms]
    unverified: "aa-extract's health endpoint reports a live DB connection; storms-explore presumably reads storms.*; owner and repo unknown"
    tables: "unknown"
    impact: "Unknown owner and tables. Needs confirming before the change."
    links:
      - {label: "storms-explore Azure app", url: "https://chd-ds-storms-explore-dzgnb8crc8fsfgee.eastus2-01.azurewebsites.net"}
      - {label: "aa-extract health endpoint", url: "https://chd-ds-aa-extract.azurewebsites.net/health"}
      - {label: "KB · deployments", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/deployments.md"}
  - id: notebooks
    label: "Analysis notebooks"
    meta: "glb-tropicalcyclones and ad-hoc work"
    role: other
    runtime: [man]
    reads: [t_storms, t_raster]
    repo: OCHA-DAP/ds-glb-tropicalcyclones
    tables: "read storms.*, public.* (prod and dev)"
    impact: "All laptop analysis against the databases stops until there is a VPN or bastion path. This is the everyday cost for the team."
    links:
      - {label: "KB · database conventions", url: "https://github.com/OCHA-DAP/ds-knowledge-base/blob/main/infrastructure/database.md"}

# Text for the Notes dialog.
notes:
  context: "The dev server (chd-rasterstats-dev) had its public network access disabled on 2026-09-22 with no private endpoint, per the storms-pipeline page; ds-storms-pipeline and storms-alerts were cut over to prod the same day and Listmonk, which runs on the dev DB, went down with it. Pages that still declare dev-stage reads are listed under Unreviewed below until they are re-synced."
  money: "Each framework row shows the last pre-arranged CERF envelope recorded on a non-retired version of that framework; the row's detail says which version it comes from and whether the latest version records an envelope at all. Several 2026 versions do not yet, so the figures are an order of magnitude, not an audited total."
  not_affected: "Frameworks whose live monitoring never opens a database connection: Kenya drought, Somalia floods, Fiji storms, Mozambique cholera, Myanmar cyclones, Bangladesh cyclone. Also the Nigeria gauge pilot, AFRO cholera, ROSEA thresholds, ACLED and GFM flood pipelines."
  mitigations:
    - "A self-hosted runner web app (chd-github-runner) exists; workflows would need runs-on changed and the app VNet-integrated."
    - "The Listmonk web app is already VNet-integrated, so the App Service pattern exists for the dashboards."
    - "No VPN, bastion or jump host for laptop access is recorded."
