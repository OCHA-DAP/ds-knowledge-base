# ----------------------------------------------------------------------------------------------------
# Deliberately off the map. Each entry is listed under "Not shown" in the page's notes with its reason.
hidden:
  - {match: ["aa.zz_legacy_*"], reason: "Superseded tables kept as read-only history."}
  - {match: [aa.funding_breakdown, aa.actual_activation, aa.activation_allocation, aa.v_funding_by_agency, aa.v_funding_by_sector,
             aa.v_funding_by_window, aa.v_aa_allocation, aa.v_activation_funding],
     reason: "The earlier knowledge-base-loaded activation and funding tables, frozen, and the views that read only them."}
  - {match: ["cron.*"], reason: "pg_cron's own tables."}
  - {match: ["kb_usage.*"], reason: "Knowledge-base usage telemetry."}
  - {match: [public.spatial_ref_sys, public.geography_columns, public.geometry_columns], reason: "PostGIS system relations."}

# Things outside the catalog snapshot altogether, named in the notes so their absence is not a surprise.
not_in_catalog:
  - "The separate listmonk database on each server (Listmonk's own tables)."

# Tables so many others point at that drawing every join would bury the map. Joins into these are drawn
# only while one end is selected (or with "Hub joins" switched on).
hubs: [cbpf.mst_pooled_fund, cbpf.pf_proj_summary_v4, cbpf.allocation_types, public.polygon, storms.admin_population]
