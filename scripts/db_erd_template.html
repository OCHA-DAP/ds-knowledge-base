  if (cv.width !== w * dpr || cv.height !== hh * dpr) { cv.width = w * dpr; cv.height = hh * dpr; cv.style.width = w + "px"; cv.style.height = hh + "px"; }

        if (!q) return true;

  if (ptrs.size === 1) { const p = [...ptrs.values()][0]; drag = { x: p.x, y: p.y, tx: st.tx, ty: st.ty }; }
  if (!ptrs.size) { drag = null; vp.classList.remove("drag"); }
};
window.addEventListener("pointerup", endPtr); window.addEventListener("pointercancel", endPtr);
vp.addEventListener("click", ev => {
  if (moved) { moved = false; return; }
  if (ev.target.closest(".zoomctl,.mini,.drawer")) return;
  const more = ev.target.closest("[data-more]");
  if (more) { const id = more.dataset.more; st.open.has(id) ? st.open.delete(id) : st.open.add(id); relayout(`.card[data-t="${CSS.escape(id)}"]`); return; }
  const gx = ev.target.closest("[data-gx]");
  if (gx) { const id = gx.dataset.gx; st.collapsed.has(id) ? st.collapsed.delete(id) : st.collapsed.add(id); relayout(`.grp[data-g="${CSS.escape(id)}"]`); renderTree(); return; }
  const card = ev.target.closest(".card"); if (card) return select({ type: "t", id: card.dataset.t });
  const gh = ev.target.closest(".gh"); if (gh) return select({ type: "g", id: gh.parentNode.dataset.g });
  const rh = ev.target.closest(".rh"); if (rh) return select({ type: "r", id: rh.parentNode.dataset.r });
  if (vp.classList.contains("far")) { const reg = ev.target.closest(".reg"); if (reg) return select({ type: "r", id: reg.dataset.r }, true); }
  select(null);
});
vp.addEventListener("dblclick", ev => {
  const card = ev.target.closest(".card"); if (!card || T[card.dataset.t].k === "g") return;
  const id = card.dataset.t; st.open.has(id) ? st.open.delete(id) : st.open.add(id); relayout(`.card[data-t="${CSS.escape(id)}"]`);
});
vp.addEventListener("wheel", ev => {
  if (ev.target.closest(".drawer")) return;
  ev.preventDefault();
  cancelAnimationFrame(anim);
  const r = vp.getBoundingClientRect(), cx = ev.clientX - r.left, cy = ev.clientY - r.top;
  const mouseWheel = ev.deltaMode !== 0 || (ev.deltaX === 0 && Math.abs(ev.deltaY) >= 50 && Number.isInteger(ev.deltaY));
  if (ev.ctrlKey || ev.metaKey) zoomAt(cx, cy, st.k * Math.exp(-ev.deltaY * 0.012));
  else if (mouseWheel) zoomAt(cx, cy, st.k * Math.exp(-Math.sign(ev.deltaY) * 0.22));
  else { st.tx -= ev.deltaX; st.ty -= ev.deltaY; applyView(); }
}, { passive: false });
// hovering a card previews its joins (hub joins and view lineage included)
let hovId = null;
vp.addEventListener("mouseover", ev => {
  const card = ev.target.closest(".card"), id = card ? card.dataset.t : null;
  if (id === hovId) return;
  $$(".e.hov", stage).forEach(el => el.classList.remove("hov"));
  hovId = id;
  if (id && !drag) for (const { i } of incident(id)) { const p = $(`.e[data-e="${i}"]`, stage); if (p) p.classList.add("hov"); }
});
const mini = $("#mini");
const miniGo = ev => { const r = mini.getBoundingClientRect(), s = mini._s; st.tx = vp.clientWidth / 2 - ((ev.clientX - r.left) / s) * st.k; st.ty = vp.clientHeight / 2 - ((ev.clientY - r.top) / s) * st.k; applyView(); };
mini.addEventListener("pointerdown", ev => { ev.stopPropagation(); mini.setPointerCapture(ev.pointerId); miniGo(ev); mini._d = true; });
mini.addEventListener("pointermove", ev => { if (mini._d) miniGo(ev); });
mini.addEventListener("pointerup", () => { mini._d = false; });
window.addEventListener("keydown", ev => {
  if (ev.target.matches("input,textarea")) { if (ev.key === "Escape") ev.target.blur(); return; }
  if ($("#notes").open) return;
  if (ev.key === "/") { ev.preventDefault(); $("#outline").classList.remove("closed"); $("#q").focus(); }
  else if (ev.key === "Escape") select(null);
  else if (ev.key === "f" || ev.key === "0") fitAll();
  else if (ev.key === "+" || ev.key === "=") zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, st.k * 1.25);
  else if (ev.key === "-") zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, st.k / 1.25);
  else if (ev.key.startsWith("Arrow")) { const d = 80; st.tx += ev.key === "ArrowLeft" ? d : ev.key === "ArrowRight" ? -d : 0; st.ty += ev.key === "ArrowUp" ? d : ev.key === "ArrowDown" ? -d : 0; applyView(); }
});
window.addEventListener("resize", () => drawMini());

// ------------------------------------------------------------------ go
if (window.innerWidth < 900) { $("#outline").classList.add("closed"); $("#tgl-outline").setAttribute("aria-pressed", "false"); }
renderLegend(); renderNotes(); applyEdgeToggles();
chooseShape();
L = layoutAll(st.W);
render(); renderTree();
{ const k = Math.min(vp.clientWidth / (L.W + 48), vp.clientHeight / (L.H + 48), 1); st.k = k; st.tx = (vp.clientWidth - L.W * k) / 2; st.ty = (vp.clientHeight - L.H * k) / 2; applyView(); }
function fromHash() {
  const m = /^#([tgr])=(.+)$/.exec(location.hash);
  if (!m) return;
  let id;
  try { id = decodeURIComponent(m[2]); } catch (e) { return; }
  if (st.sel && st.sel.type === m[1] && st.sel.id === id) return;
  if ((m[1] === "t" && T[id]) || (m[1] === "g" && G[id]) || (m[1] === "r" && R[id])) select({ type: m[1], id }, true);
}
window.addEventListener("hashchange", fromHash);
fromHash();
})();
