# mandates/registry.yml — see _about. Maintained by hand; rendered by scripts/mandates_registry.py.
_about: Machine-readable index of the primary documents behind mandates/. Rendered into the pages by scripts/mandates_registry.py (tables between <!-- registry:NAME --> markers); `--check` verifies every
  extract exists under raw/mandates/. Dates are adoption dates taken from the plenary line printed at the end of each resolution, never from a header or an index. Edit this file, then run the script.
